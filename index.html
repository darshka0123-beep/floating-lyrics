<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Floating Lyrics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        `
import streamlit as st
import time

# Custom CSS for aesthetic pink card & font
st.markdown("""
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

.stApp {
    background-color: #FFD1DC;
    color: #FFFFFF;
}

.lyric-card {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    text-align: center;
    padding: 20px;
    background-color: #FFB6C1;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
}
</style>
""", unsafe_allow_html=True)

st.title("Floating Lyrics")

LYRICS = [
    (0, "it's a day for you"),
    (5, "oh, babe")
]

card_placeholder = st.empty()
start_button = st.button("Start Lyrics Sync")

if start_button:
    start_time = time.time()
    for timestamp, text in LYRICS:
        while time.time() - start_time < timestamp:
            time.sleep(0.1)
        card_placeholder.markdown(
            f'<div class="lyric-card">{text}</div>',
            unsafe_allow_html=True
        )
`,
        document.getElementById("root")
      );
    </script>
  </body>
</html>
